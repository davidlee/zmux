note = "VERIFIED against harness/advertise.sh:6-8,21 and tests/claude-state.test.ts:94-97. write_state returns failure when set fails, while a get failure without label output now succeeds with empty labels and reaches the ZMX_SESSION fallback. The new test's fake zmx succeeds only for set, so it actually separates set success from get failure; it checks the fallback title and the state write. All 42 Node harness tests pass. Removing only '|| :' from the label read in a disposable copy makes precisely this new regression test fail (41 pass, 1 fail). Independent bash and dash probes confirm set-success/get-failure emits valid fallback-title JSON, and set failure remains silent with exit 0. No live zmx or Claude session was used."

