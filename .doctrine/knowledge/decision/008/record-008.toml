[facet]                         # every field typed; seeded empty (captured later)
context = "zmux has to work from elisp and bash and agent harnesses without a binding, and the naming convention must not drift between them."
choice = "The wrapper knows no integration by name. Its contract is argv and lines, and its launcher is data. Each integration lives with the tool it belongs to."
alternatives = []
rationale = "The convention lives in one place, so a plugin or picker can't drift from it."
consequences = ["Windows and notifications belong in nix-config if they ever exist", "The launcher is an argv prefix set by ZMX_LAUNCHER"]
