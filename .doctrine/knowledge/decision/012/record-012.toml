[facet]                         # every field typed; seeded empty (captured later)
context = "The inspiration is zmx and tmux. zmx already provides the substrate, so zmux adds a convention rather than a second system."
choice = "No daemon or server. No reader or TUI of our own. No status protocol or screen renderer. No splits or tabs or layout. No config tree. No manifest. No fork of zp or fork of pi-zmx to carry the convention. No ZMX_SESSION_PREFIX support."
alternatives = ["A server of our own", "Declare sessions in a manifest"]
rationale = "zmx already has the capability. HYP-002 holds that what is missing is legibility: who is running for which project and in what state. Anything bigger is a second zmx."
consequences = ["A proposal must plug into an affordance zmx already has", "A proposal must be the least code that makes agent work faster"]
