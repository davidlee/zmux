[facet]                         # every field typed; seeded empty (captured later)
context = "The inspiration, herdr, is the same product with a custom server and protocol and config language. zmx already provides the substrate."
choice = "No daemon or server. No reader or TUI of our own. No status protocol or screen renderer. No splits or tabs or layout. No config tree. No manifest. No fork of zp or fork of pi-zmx to carry the convention. No ZMX_SESSION_PREFIX support."
alternatives = ["Own a server as herdr does", "Declare sessions in a manifest"]
rationale = "The missing thing is legibility and not capability: who is running for which project and in what state. Anything bigger is a second zmx."
consequences = ["A proposal must plug into an affordance zmx already has", "A proposal must be the least code that makes agent work faster"]
