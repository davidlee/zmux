tags = ["smut:d-harness-state"]

[facet]                         # every field typed; seeded empty (captured later)
context = "Only the harness knows it is asking a human, so blocked can't come from the wrapper."
choice = "blocked is written by a small harness-specific plugin or extension or hook. It runs in the harness and when ZMX_SESSION is set writes that session's state as the harness waits on a human and resumes. It does not depend on pi-zmx."
alternatives = []
rationale = "This fits DEC-004: the writer is the party that knows. Each plugin stays tiny, so nothing needs forking."
consequences = ["pi came first: harness/pi/zmx-state.ts", "Claude's plugin is expected to break regularly and carries no weight in the design"]
